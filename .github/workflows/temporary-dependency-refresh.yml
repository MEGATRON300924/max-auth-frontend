name: Temporary dependency refresh

on:
  push:
    branches:
      - feat/developer-focused-theme-system

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Remove unused vulnerable Zod dependency
        run: npm uninstall zod
      - name: Apply non-breaking security updates
        run: npm audit fix || npm audit --audit-level=high
      - name: Verify critical advisories
        run: npm audit --audit-level=critical
      - name: Verify production high-risk advisories
        run: npm audit --omit=dev --audit-level=high
      - name: Verify production build
        run: npm run build
        env:
          NEXT_PUBLIC_API_URL: https://auth.max-ai.name.ng/api/v1
      - name: Commit refreshed dependency lock
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json
          if git diff --cached --quiet; then
            echo "No dependency changes to commit."
          else
            git commit -m "fix: refresh dependencies for security advisories"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi
