name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: max-auth-frontend-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Build application
        run: npm run build
        env:
          NEXT_PUBLIC_API_URL: https://auth.max-ai.name.ng/api/v1
      # Run audits after the build so dependency advisories do not hide compile errors.
      - name: Check for critical dependency vulnerabilities
        run: npm audit --audit-level=critical
      - name: Check production dependencies for high-risk advisories
        run: npm audit --omit=dev --audit-level=high
